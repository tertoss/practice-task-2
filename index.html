<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный счетчик</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter-container">
        <div id="result" class="result-box red">0</div>
        
        <div class="buttons">
            <button id="minus-btn" class="btn">Минус (-)</button>
            <button id="plus-btn" class="btn">Плюс (+)</button>
        </div>

        <div id="message" class="message-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
